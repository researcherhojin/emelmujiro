name: "Setup uv with cache"
description: "Install uv, restore cache, and sync backend dependencies"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        # Must match the `ghcr.io/astral-sh/uv:<version>` image in backend/Dockerfile,
        # so CI resolves and syncs with the same uv the production image runs.
        version: "0.12.5"
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install backend dependencies
      shell: bash
      working-directory: ./backend
      run: uv sync --frozen --extra dev
