# Dependabot configuration for automated dependency updates
version: 2
updates:
  # All npm dependencies -- root AND the `frontend` workspace.
  #
  # There is deliberately only ONE npm entry. A second one at `/frontend` was
  # registered here from the start and produced exactly three PRs in the repo's
  # history -- #489, #490 and #516 -- every one of them unmergeable as filed and
  # every one a duplicate of a PR this entry had already opened. The cause is
  # structural: root `package.json` declares `frontend` as a workspace, so this
  # scan already sees every frontend dependency -- every frontend bump it files
  # carries the `frontend` label, #517 and #519-#523 among them -- while
  # `package-lock.json` lives at the repo root, OUTSIDE `/frontend`. A
  # `/frontend`-scoped job therefore rewrites
  # `frontend/package.json` and cannot touch the lockfile that resolves it.
  # #516 (`@sentry/react` 11.0.0) is the clean example -- a one-file diff, filed
  # 98 s before #519 proposed the identical bump with its lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    # 10, not 5: this entry now carries the whole npm surface.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "root"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # Majors that need a migration rather than a merge. These lived on the
    # deleted `/frontend` entry, where they only ever filtered the three broken
    # PRs above -- this is the first time they apply to the PRs actually filed.
    # The `tailwindcss` ignore is unaffected by the deletion either way: it is
    # also stored against THIS entry, set by `@dependabot ignore this major
    # version` on #461, which carries the `root` label.
    ignore:
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "web-vitals"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lint-staged"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # No `groups:` on purpose. The deleted entry defined react / tiptap /
    # testing / dev-dependencies groups, and the only PRs they ever produced
    # were #489 and #490 -- the two the CHANGELOG records as filed without a
    # lockfile and as a major smuggled into a dev-dependencies group. Grouping
    # also breaks the patch auto-merge in `pr-checks.yml`, which keys on
    # `update-type == version-update:semver-patch`: a grouped PR reports the
    # HIGHEST update type it contains, so one minor in the batch holds every
    # patch in it for manual review (Gotcha #12).

  # Backend dependencies are managed by uv (NOT pip). The `uv` ecosystem at the
  # bottom of this file now handles pyproject.toml + uv.lock, so the manual
  # `uv sync --upgrade` cadence this block used to prescribe is retired.
  # Dependency names in backend/pyproject.toml MUST be PEP 503-normalized
  # (lowercase): dependabot builds its manifest-rewrite regex from the
  # normalized name and matches it case-sensitively, so a capitalized pin is
  # never rewritten, and the `uv lock --upgrade-package <name>==<new>` that
  # follows then contradicts the untouched pin. See CLAUDE.md Gotcha #19.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "deps"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    commit-message:
      prefix: "deps"
      include: "scope"
  # Images pulled straight from docker-compose*.yml (nginx, Umami, its Postgres).
  # The two `docker` entries above watch only `Dockerfile`s, so these drifted 6-9
  # months until 2026-10-06. Postgres majors are ignored: a new major cannot
  # read the existing `umami_db` volume, so that upgrade is a dump-and-restore
  # project, not a tag bump.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"
  # Backend Python deps. Every other ecosystem here was registered from the start;
  # this one was not, so backend versions drifted with no automation at all — which
  # is why the urllib3 (CVE-2026-44431/44432) and pyjwt (CVE-2026-48526) advisories
  # were both first seen as a red Trivy gate blocking unrelated PRs rather than as a
  # dependabot PR. uv.lock lives in /backend alongside pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
