name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Workflow-level default: read-only. Jobs that need write access
# opt in explicitly at job level (least-privilege principle).
permissions:
  contents: read

concurrency:
  group: "pr-checks-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

env:
  # Suppress "hint: Using 'master' as the name for the initial branch" from actions/checkout
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Dependabot auto-approve and auto-merge
  dependabot-auto-merge:
    name: Auto-Merge Dependabot
    runs-on: ubuntu-24.04
    # 8, not 5: the re-arm step below polls for the merge to land, and the
    # slowest measured auto-merge took 166 s (#509). Time spent waiting on
    # `needs` does not count against this.
    timeout-minutes: 8
    # Gated on the tests, which it was NOT until 2026-09-28. `main` carries no
    # required status checks, so `--auto` merged the moment it was called and
    # every check landed after the fact. Measured across 9 auto-merged PRs:
    # `Test Affected Code` concluded +16 s to +92 s past the merge, E2E +107 s
    # to +167 s, Lighthouse CI +187 s to +276 s. Worse, the verdict was
    # ignored -- #517, #521 and #522 each merged with `Test Affected Code =
    # failure`, and that failure was the vitest de-hoisting bug that broke
    # `main` and reddened all seven open PRs.
    #
    # `affected-tests` has no `needs` and no job-level `if:`, so it always
    # reports success or failure, and testing for `success` needs no
    # `skipped` escape hatch. A PR with a merge conflict starts no
    # pull_request run at all, so it cannot reach this job either.
    # Cost: a patch merge now waits for the test job -- roughly 1.5-2 min
    # instead of ~15 s.
    #
    # The two lint jobs gate it too (2026-10-18). Tests alone let #543 merge
    # while `Frontend Lint` (which runs tsc) had already failed, and a
    # formatter bump such as black can fail `Backend Lint` with every test
    # green. Neither lint job has `needs` or a job-level `if:`, so, like
    # affected-tests, each always reports success or failure. They run in
    # parallel with the tests: across the 7 auto-merged PRs of 2026-10-17
    # (#587, #588, #594, #596, #597, #598, #601) the later lint finished 0 s
    # to 38 s after `Test Affected Code`, so that is the added wait.
    #
    # `docker-images` gates it too (2026-10-23): it builds and checks only the
    # images whose inputs changed, so a docker or docker-compose bump such as
    # nginx (#618) no longer merges without a build. It always runs, like the others.
    needs: [affected-tests, frontend-lint, backend-lint, docker-images]
    if: >-
      github.actor == 'dependabot[bot]' &&
      needs.affected-tests.result == 'success' &&
      needs.frontend-lint.result == 'success' &&
      needs.backend-lint.result == 'success' &&
      needs.docker-images.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      # Required by the re-arm step's `gh workflow run`.
      actions: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bare --squash, not --auto. The repo has `allow_auto_merge: false`, so
      # --auto has no queue to sit in; measured, it merged ~2 s after the call
      # anyway, which is undocumented fallback behavior this job should not
      # depend on. Now that the job is gated on `affected-tests`, "merge when
      # checks pass" is already satisfied and the honest instruction is "merge
      # now". Retried because mergeability flips to UNKNOWN for 60-90 s while
      # GitHub recomputes after a sibling PR lands (Gotcha #12).
      - name: Merge patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge --squash "$PR_URL"; then
              echo "Merged on attempt $attempt"
              exit 0
            fi
            echo "Merge attempt $attempt failed; mergeability may still be recomputing"
            sleep 20
          done
          echo "::error::Could not merge $PR_URL after 6 attempts"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A push made with GITHUB_TOKEN creates no workflow run, and the step
      # above merges with exactly that token. So the merge commit this job puts
      # on main runs neither Sync README Badges nor deploy-mac-mini.
      #
      # deploy-drift-check.yml already covers the deploy half, but only the
      # deploy half and only nightly: it dispatches when production != main, so
      # when production happens to already match main it exits 0 and the badge
      # sync still never runs. Measured cost of that gap: i18next 26.4.0 ->
      # 26.4.2 auto-merged as d39a2723 (2026-09-14 04:16:25Z, zero Main CI/CD
      # Pipeline runs) and README carried the stale badge until e0484722 at
      # 22:39:45Z -- 18 h 24 m, during which four open PRs (#501 #504 #505 #507)
      # inherited a red Repo Checks that had nothing to do with their diffs.
      #
      # workflow_dispatch is the documented exception to the loop-prevention
      # rule ("always create workflow runs"), so this needs no PAT -- same
      # mechanism deploy-drift-check.yml relies on.
      - name: Re-arm the pipeline once the merge lands
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The step above merges synchronously and fails the job if it cannot,
          # so in practice attempt 1 sees merged == true. The poll is kept for
          # the window where the API has not yet caught up. It was sized when
          # the merge was asynchronous (`--auto`), against measured create ->
          # merge times of 12 s (#503), 15 s (#506), 14 s (#508), 166 s (#509)
          # and 15 s (#511); 20 x 15 s = 5 min still covers that with headroom.
          for attempt in $(seq 1 20); do
            if [ "$(gh api "repos/$REPO/pulls/$PR_NUM" -q .merged)" = "true" ]; then
              gh workflow run "Main CI/CD Pipeline" --repo "$REPO" --ref main
              echo "Dispatched Main CI/CD Pipeline after auto-merge (attempt $attempt)"
              exit 0
            fi
            sleep 15
          done
          # Yield, do not fail. A late merge is normal behavior, and the
          # nightly drift check is the backstop -- turning it red here would
          # make correct operation look broken.
          echo "::notice::auto-merge has not landed within 5 min - leaving it to deploy-drift-check.yml"

  # Informational only, and deliberately NOT a dependency of any other job.
  # These all used to sit in a `quick-checks` job, where any `exit 1` failed it
  # and skipped all six downstream ones — Frontend Lint, Backend Lint, Test
  # Affected Code, Security Scan, Build for Analysis, E2E Tests. So a stale
  # README badge, a missing test-count line, a non-conventional commit subject
  # or an i18n false positive silently disabled `npm ci` and the entire suite
  # for that PR — which is how the jest-dom 7 lockfile drift reached a deploy.
  # `main` has no required status checks, so gating never blocked a merge
  # anyway; it only destroyed test signal. Its last check, merge conflicts,
  # went on 2026-10-23: GitHub starts no pull_request run for a conflicted
  # PR, so it could never fail (and logged `fatal: Not a valid object name
  # main` on every run). No PR job gates another on a precondition now.
  repo-checks:
    name: Repo Checks (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # scripts/check-commit-msg.sh is the single source of truth for the
          # accepted types and the merge/autosquash/revert/dependabot exemptions.
          # The .husky/commit-msg hook calls the same script, so this job and the
          # local hook cannot drift apart. Do not re-inline the regex here.
          # %B (whole message) and -z (NUL record separator), not %s. The script
          # now also rejects a CI-skip marker anywhere in the message, and a
          # body cannot survive a line-oriented loop: with %s it never saw one,
          # and with %B alone a blank line inside a body is indistinguishable
          # from a record boundary. NUL is the only separator a message cannot
          # contain. Read with `-d ''` to match.
          # The messages go through a file, never `$(...)`: command
          # substitution drops NUL bytes, which left the loop with no record
          # and zero messages checked from b1e6df2e (2026-09-28) until 2026-10-23.
          # git log's exit code is checked separately, and an empty range
          # fails too: a bad range (force-push, missing base) must not pass
          # green with nothing checked. Same trap as Gotcha #11.
          MESSAGES_FILE="$RUNNER_TEMP/commit-messages"
          if ! git log -z --format="%B" "${BASE_SHA}..${HEAD_SHA}" > "$MESSAGES_FILE"; then
            echo "❌ Could not read commits in ${BASE_SHA}..${HEAD_SHA}"
            exit 1
          fi
          FAILED=0
          CHECKED=0
          while IFS= read -r -d '' msg || [ -n "$msg" ]; do
            [ -z "${msg//[[:space:]]/}" ] && continue
            CHECKED=$((CHECKED + 1))
            ./scripts/check-commit-msg.sh "$msg" || FAILED=1
          done < "$MESSAGES_FILE"
          if [ "$CHECKED" -eq 0 ]; then
            echo "❌ No commit messages found in ${BASE_SHA}..${HEAD_SHA}"
            exit 1
          fi
          echo "Checked $CHECKED commit message(s)"
          exit "$FAILED"

      - name: File size check
        run: |
          # Check for large files (> 10MB)
          find . -type f -size +10M | grep -v node_modules | grep -v .git && echo "Large files detected!" && exit 1 || exit 0

      - name: SEO files check
        run: |
          MISSING=0
          # robots.txt, sitemap.xml, sitemap-index.xml are generated at build time (not in git)
          for f in frontend/public/manifest.json frontend/public/favicon.ico; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "$MISSING required SEO/static files missing"
            exit 1
          fi
          echo "All SEO files present"

      - name: Check i18n unused keys
        # Single source of truth: scripts/check-i18n-keys.sh.
        # --strict exits 1 on unused keys; default mode is informational (local use).
        run: ./scripts/check-i18n-keys.sh --strict

      - name: Test Claude Code guard hooks
        # Block/allow cases for the PreToolUse Bash hook in .claude/settings.json.
        run: ./.claude/hooks/test-guard-bash.sh

      - name: Check README test counts exist
        # Value-level verification (count == reality) lives in main-ci-cd.yml's
        # frontend-test/backend-test jobs, which parse the *real* Vitest/Django
        # output instead of relying on grep heuristics over test files.
        # grep undercounts because `it.each([...])` expands into N tests at runtime.
        run: |
          README_FE=$(grep -oE 'Vitest \([0-9]+ tests\)' README.md | grep -oE '[0-9]+')
          README_BE=$(grep -oE 'Django unittest \([0-9]+ tests\)' README.md | grep -oE '[0-9]+')
          if [ -z "$README_FE" ] || [ -z "$README_BE" ]; then
            echo "❌ README test counts missing"
            echo "Frontend: ${README_FE:-not found}, Backend: ${README_BE:-not found}"
            exit 1
          fi
          echo "README test counts present ($README_FE frontend + $README_BE backend)"

      - name: Check README badge versions match package-lock.json and uv.lock
        run: |
          ERRORS=0
          # Backend runtime badges resolve through backend/uv.lock, not
          # pyproject.toml: pyproject mixes exact pins (gunicorn==26.0.0) with
          # floors (coverage>=7.15.4), and a floor is not the installed version.
          # The version pattern allows two components because PyPI ships them
          # (Django's next minor is 6.1); a hardcoded X.Y.Z matches nothing there
          # and would report clean while drifting.
          check_backend_badge() {
            local name="$1" pkg="$2"
            local lock_ver=$(awk -v pkg="$pkg" '
              /^\[\[package\]\]/ { in_pkg = 0 }
              $0 == "name = \"" pkg "\"" { in_pkg = 1; next }
              in_pkg && /^version = / { gsub(/[",]/, "", $3); print $3; exit }
            ' backend/uv.lock)
            local badge_ver=$(grep -oE "/badge/${name}-[0-9]+(\.[0-9]+){1,2}" README.md | head -1 | sed -E "s#/badge/${name}-##")
            if [ -n "$lock_ver" ] && [ -n "$badge_ver" ] && [ "$lock_ver" != "$badge_ver" ]; then
              echo "❌ $name badge: $badge_ver ≠ uv.lock: $lock_ver"
              ERRORS=$((ERRORS + 1))
            fi
          }
          check_badge() {
            local name="$1" pkg="$2"
            # Installed version, not the package.json range floor; frontend/
            # node_modules first because a de-hoisted copy is what ships.
            local pkg_ver=$(node -e "const l=require('./package-lock.json').packages; const n=process.argv[1]; const e=l['frontend/node_modules/'+n]||l['node_modules/'+n]; console.log(e&&e.version||'')" "$pkg")
            # Anchored on /badge/ so `i18next` cannot match `React_i18next`.
            local badge_ver=$(grep -oE "/badge/${name}-[0-9]+\.[0-9]+\.[0-9]+" README.md | head -1 | sed -E "s#/badge/${name}-##")
            if [ -n "$pkg_ver" ] && [ -n "$badge_ver" ] && [ "$pkg_ver" != "$badge_ver" ]; then
              echo "❌ $name badge: $badge_ver ≠ package-lock.json: $pkg_ver"
              ERRORS=$((ERRORS + 1))
            fi
          }
          # Badge order mirrors README section layout (frontend / testing).
          # Package names reach node as argv, so scoped names (@*/*) need no quoting.
          check_badge "React" "react"
          check_badge "TypeScript" "typescript"
          check_badge "Vite" "vite"
          check_badge "React_Router" "react-router"
          check_badge "Tailwind_CSS" "tailwindcss"
          check_badge "Typography" "@tailwindcss/typography"
          check_badge "i18next" "i18next"
          check_badge "React_i18next" "react-i18next"
          check_badge "Axios" "axios"
          check_badge "TipTap" "@tiptap/react"
          check_badge "DOMPurify" "dompurify"
          check_badge "Vitest" "vitest"
          check_badge "Testing_Library" "@testing-library/react"
          check_badge "Playwright" "@playwright/test"
          # Backend section. Added 2026-08-17: these four were the only version
          # badges in README with no gate at all on either side.
          check_backend_badge "Django" "django"
          check_backend_badge "DRF" "djangorestframework"
          check_backend_badge "SimpleJWT" "djangorestframework-simplejwt"
          check_backend_badge "Gunicorn" "gunicorn"
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS README badge(s) out of sync with package-lock.json / uv.lock"
            echo "Run: scripts/sync-readme-badges.sh (auto-heals on main via the readme-sync job)"
            exit 1
          fi
          echo "All README badges match package-lock.json and uv.lock"

      - name: Check route lists agree
        # App.tsx, staticRoutes, e2e/seo.spec.ts and lighthouserc.js each
        # hardcode their own route list and none consults another. The costly
        # one is a static route in App.tsx but not staticRoutes: it ships a
        # hard 404 while the prerender step still prints success, because that
        # step asserts the count of routes it was handed. Sits above Setup
        # Node.js on purpose — the script requires only node builtins and
        # package.json, so it needs no npm ci to run.
        run: node frontend/scripts/check-route-lists.js

      # Placed here, not at the top of the job: the bash-only checks above need
      # no dependencies, so a failure in one of them ends the job without paying
      # for setup. save-cache is false because this job runs in parallel with
      # the jobs that do save it — restore read-only rather than race them.
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          save-cache: false

      - name: Type-check and test operational scripts
        run: npm run check:scripts

      - name: Test sitemap generation
        run: node --test frontend/scripts/test-generate-sitemap.cjs

      - name: Spell check
        # cspell was config-only until 2026-08-18: cspell.json existed and the
        # maintainer's editor surfaced findings, but nothing ran it, so typos
        # were caught by whoever happened to open the file. Now a declared
        # devDependency (pinned, so a cspell release cannot silently change the
        # verdict) run over the whole repo. ignorePaths excludes build output
        # (coverage/, playwright-report/, test-results/, build/) — those carried
        # 307 of the 314 findings in the first full scan and are all gitignored.
        run: npm run spell

      - name: Check cron log redirect paths
        # Operational cron logs must live inside the project at backend/logs/
        # (matches Django LOG_DIR, already gitignored, persists via logs_volume).
        # Drift to /tmp, ~/logs/, or /var/log/ breaks on reboot or leaves
        # emelmujiro logs outside the project tree. See .claude/rules/ci.md "Operational logs".
        # The Makefile builds each entry as `echo "... >> log" | crontab -`,
        # so `>>` comes before `crontab`; a `crontab.*>>` grep matched nothing
        # and passed any target. Match both orders, and fail on zero matches
        # so the check cannot go silent again.
        run: |
          CRON_LOGS=$(grep -nE '>>.*crontab|crontab.*>>' Makefile || true)
          if [ -z "$CRON_LOGS" ]; then
            echo "❌ No cron redirect found in Makefile; update this check if the cron targets moved"
            exit 1
          fi
          echo "Cron redirects found:"
          echo "$CRON_LOGS"
          BAD_CRON_LOGS=$(printf '%s\n' "$CRON_LOGS" | grep -v 'backend/logs/' || true)
          if [ -n "$BAD_CRON_LOGS" ]; then
            echo "❌ Cron log redirect must target backend/logs/ (not /tmp, ~/logs/, or /var/log/):"
            echo "$BAD_CRON_LOGS"
            exit 1
          fi
          echo "Cron log paths OK"

      # The two CHANGELOG steps run last on purpose: a failed step skips every
      # later step in the job, so placed earlier a missing entry would hide
      # the results of every check above.
      - name: Test CHANGELOG check
        # Pass/warn cases for scripts/check-changelog.sh in a throwaway repo.
        run: ./scripts/test-check-changelog.sh

      - name: Check CHANGELOG entry
        # scripts/check-changelog.sh is the single source of truth for the
        # exempt paths; .husky/pre-push calls it for direct pushes to main.
        # Dependabot PRs deliberately carry no entry, and patch ones merge with
        # no human in the loop, so a check that reddened them would be ignored.
        # head.sha, not github.sha: github.sha is the synthetic merge commit.
        # See .claude/rules/ci.md "CHANGELOG entry".
        if: github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-changelog.sh "$BASE_SHA" "$HEAD_SHA"

  # Frontend linting (parallel with backend-lint)

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with cache
        uses: ./.github/actions/setup-node

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        # No CI job ran tsc until 2026-08-25: type-check lived only in the
        # local `npm run validate`, and the deploy build's tsc pass ran on the
        # Mac mini's node_modules, which can lag the lockfile. That is how the
        # @tiptap 3.30.2 bumps (#459/#465) broke `npm run type-check` on main
        # for two days with every check green.
        working-directory: ./frontend
        run: npm run type-check

      - name: Prettier
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,md}"

  # Backend linting (parallel with frontend-lint)
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv with cache
        uses: ./.github/actions/setup-uv

      - name: Black check
        working-directory: ./backend
        run: uv run black --check .

      - name: Flake8
        working-directory: ./backend
        run: uv run flake8 . --max-line-length=120 --exclude=migrations,venv,.venv

  # Run only affected tests based on changed files
  affected-tests:
    name: Test Affected Code
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          separator: ","

      # Frontend dependencies resolve from the root package-lock.json, so a
      # root-only lockfile change (#608, #625, #627) must run the suite too.
      - name: Setup Node.js with cache
        if: contains(steps.changed-files.outputs.all_changed_files, 'frontend/') || contains(steps.changed-files.outputs.all_changed_files, 'package-lock.json')
        uses: ./.github/actions/setup-node

      - name: Test frontend changes
        if: contains(steps.changed-files.outputs.all_changed_files, 'frontend/') || contains(steps.changed-files.outputs.all_changed_files, 'package-lock.json')
        working-directory: ./frontend
        run: CI=true npm test -- --run
        timeout-minutes: 10

      - name: Setup uv with cache
        if: contains(steps.changed-files.outputs.all_changed_files, 'backend/')
        uses: ./.github/actions/setup-uv

      - name: Test backend changes
        if: contains(steps.changed-files.outputs.all_changed_files, 'backend/')
        working-directory: ./backend
        env:
          SECRET_KEY: test-secret-key-that-is-at-least-fifty-bytes-long-for-hmac-sha256
          DEBUG: "True"
          DATABASE_URL: ""
        run: |
          uv run python manage.py makemigrations --check --noinput
          uv run python manage.py migrate --noinput
          uv run python manage.py test

  # Security scan for dependencies
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Restore only, with the action's own key scheme. `Warm Shared Caches`
      # saves it in `main`'s scope; `cache: "false"` below stops the action
      # from saving a 91 MB copy per PR. The action always sets TRIVY_CACHE_DIR
      # to its `cache-dir` input (default `${{ github.workspace }}/.cache/trivy`).
      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
          restore-keys: cache-trivy-

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          cache: "false"

  # Shared build job for bundle-analysis and lighthouse
  build-for-analysis:
    name: Build for Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with cache
        uses: ./.github/actions/setup-node

      - name: Build frontend
        working-directory: ./frontend
        env:
          # Use relative API URL so Lighthouse preview doesn't trigger CORS
          # errors against the production API (errors-in-console audit).
          VITE_API_URL: /api
        run: CI=false npm run build:no-prerender

      - name: Check bundle size
        run: |
          echo "Build size:"
          du -sh frontend/build/
          BUILD_SIZE=$(du -sb frontend/build/ | cut -f1)
          MAX_SIZE=10485760  # 10MB in bytes
          if [ $BUILD_SIZE -gt $MAX_SIZE ]; then
            echo "Build size exceeds 10MB limit!"
            echo "Current size: $(du -sh frontend/build/)"
            exit 1
          fi
          echo "Build size is acceptable: $(du -sh frontend/build/)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pr-build
          path: frontend/build/
          retention-days: 1

  # Images are otherwise built only on the deploy host, where a failure stays
  # green (Gotcha #17), and Dependabot's docker and docker-compose bumps
  # auto-merge on tests and lint alone (#618, nginx, merged with zero tests).
  # This builds and checks only the images whose inputs the PR touches, with
  # no layer cache (a PR-scoped cache refills the 10 GB limit). It has no
  # `needs` and no job-level `if:`, so it always reports success or failure
  # and the auto-merge gate can require it.
  # Intent: docs/intents/ci/docker-image-checks.md
  docker-images:
    name: Docker Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect image changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ! FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "❌ Could not diff ${BASE_SHA}..${HEAD_SHA}"
            exit 1
          fi
          flag() {
            if printf '%s\n' "$FILES" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "$1: changed, will check"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          flag backend '^backend/(Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock)$'
          flag postgres '^docker/postgres/'
          flag umami '^docker/umami/'
          flag nginx '^(docker-compose\.yml|frontend/nginx\.conf)$'

      - name: Build backend image
        if: steps.changed.outputs.backend == 'true'
        run: docker build --build-arg GIT_COMMIT=ci-check -t emelmujiro/backend:ci-check ./backend

      - name: Build and verify PostgreSQL image
        if: steps.changed.outputs.postgres == 'true'
        run: |
          docker build -t emelmujiro/postgres:ci-check ./docker/postgres
          sh docker/postgres/verify.sh emelmujiro/postgres:ci-check

      - name: Build and verify Umami image
        if: steps.changed.outputs.umami == 'true'
        env:
          UMAMI_TEST_IMAGE: emelmujiro/umami:ci-check
        run: |
          docker build -t "$UMAMI_TEST_IMAGE" ./docker/umami
          sh docker/umami/verify.sh

      # The pinned upstream image is not built here; this proves it starts
      # with the repo's config, mounted where Compose mounts it. `nginx -t`
      # resolves proxy_pass hosts, so the two upstreams get loopback entries.
      - name: Check nginx config against the pinned image
        if: steps.changed.outputs.nginx == 'true'
        run: |
          IMAGE=$(grep -m1 -oE 'image: nginx:[^[:space:]]+' docker-compose.yml | cut -d' ' -f2)
          if [ -z "$IMAGE" ]; then
            echo "❌ No nginx image pin found in docker-compose.yml"
            exit 1
          fi
          echo "Checking frontend/nginx.conf with $IMAGE"
          docker run --rm --add-host backend:127.0.0.1 --add-host umami:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/nginx.conf:ro" "$IMAGE" nginx -t

  # Lighthouse CI performance audit (uses shared build + bundle check)
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-for-analysis
    if: needs.build-for-analysis.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with cache
        uses: ./.github/actions/setup-node

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: pr-build
          path: frontend/build/

      - name: Run Lighthouse CI
        working-directory: ./frontend
        run: npx @lhci/cli autorun

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci/
          # upload-artifact skips hidden paths by default, and `.lighthouseci`
          # is one: the upload found "No files" on every run until this was set.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # E2E tests (Playwright — Chromium only for speed)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js with cache
        uses: ./.github/actions/setup-node

      - name: Get Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Restore only: `Warm Shared Caches` saves this key in `main`'s scope.
      # Saving here stored one 279 MB copy per PR (docs/intents/ci/actions-cache-scope.md).
      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (full)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./frontend
        run: npx playwright install-deps chromium

      - name: Run E2E tests (Chromium only)
        working-directory: ./frontend
        run: npx playwright test --project=chromium
        timeout-minutes: 10

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # PR comment with results summary
  pr-comment:
    name: PR Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    permissions:
      pull-requests: write
    needs:
      [
        frontend-lint,
        backend-lint,
        affected-tests,
        security-scan,
        build-for-analysis,
        lighthouse,
        e2e-tests,
        docker-images,
      ]
    steps:
      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('## Pull Request Check Results')
            );

            const body = `## Pull Request Check Results

            | Check | Status |
            |-------|--------|
            | Frontend Lint | ${{ needs.frontend-lint.result == 'success' && '✅' || '❌' }} |
            | Backend Lint | ${{ needs.backend-lint.result == 'success' && '✅' || '❌' }} |
            | Tests | ${{ needs.affected-tests.result == 'success' && '✅' || '❌' }} |
            | Security | ${{ needs.security-scan.result == 'success' && '✅' || '❌' }} |
            | Build & Size | ${{ needs.build-for-analysis.result == 'success' && '✅' || '❌' }} |
            | Lighthouse | ${{ needs.lighthouse.result == 'success' && '✅' || '❌' }} |
            | E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅' || needs.e2e-tests.result == 'failure' && '❌' || '⏭️' }} |
            | Docker Images | ${{ needs.docker-images.result == 'success' && '✅' || '❌' }} |

            <details>
            <summary>Details</summary>

            - **Commit:** ${{ github.sha }}
            - **Author:** ${{ github.actor }}
            - **Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            </details>`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
