name: Warm Shared Caches

# PR jobs can restore caches from `main` but not from each other. Saving the
# Playwright browser and the Trivy DB here, in `main`'s scope, lets every PR
# restore them read-only instead of storing its own copy (21 copies of the
# 279 MB browser pushed the repo past the 10 GB cache limit on 2026-10-22).
# Intent: docs/intents/ci/actions-cache-scope.md
on:
  push:
    branches: [main]
  schedule:
    # Daily, so auto-merged commits (GITHUB_TOKEN pushes start no workflow)
    # and the date-keyed Trivy cache are still covered.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm
  cancel-in-progress: false

env:
  # Suppress "hint: Using 'master' as the name for the initial branch" from actions/checkout
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  playwright:
    name: Playwright browser
    runs-on: ubuntu-24.04
    # Not on any PR's path, so it can wait out a slow mirror: filling the apt
    # cache downloaded 25.9 MB in 9 min 3 s (run 39896636044), close to the old
    # 10-minute limit, and a cancelled job saves no cache.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js (read-only node_modules cache)
        uses: ./.github/actions/setup-node
        with:
          save-cache: "false"

      - name: Get Playwright version
        id: playwright-version
        working-directory: ./frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Same path and key as `E2E Tests` in pr-checks.yml, which only restores.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Download Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install chromium

      # The Ubuntu packages the browser needs. A slow mirror once took 5 min
      # 27 s for their 25.9 MB (run 39894065554), so they are cached too.
      # Same directory and key as `E2E Tests`, which only restores.
      # docs/intents/ci/apt-and-node-cache-scope.md
      - name: Point apt's package archive at a cacheable directory
        id: apt
        run: |
          # `_apt` cannot enter the runner's home, so apt downloads as root
          # there; saying so keeps it from warning on every run.
          mkdir -p "$HOME/apt-archives/partial"
          printf 'Dir::Cache::Archives "%s/apt-archives/";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/99-playwright-archives > /dev/null
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ runner.os }}-playwright-apt-${{ steps.playwright-version.outputs.version }}-${{ steps.apt.outputs.image }}
          restore-keys: |
            ${{ runner.os }}-playwright-apt-${{ steps.playwright-version.outputs.version }}-
            ${{ runner.os }}-playwright-apt-

      - name: Download Playwright system packages
        working-directory: ./frontend
        run: npx playwright install-deps chromium

  trivy:
    name: Trivy DB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same action pin as `Security Scan` in pr-checks.yml. With `cache: true`
      # the action saves its DB as `cache-trivy-<UTC date>` from
      # `${{ github.workspace }}/.cache/trivy`, which the PR job restores.
      # Findings are the PR check's job; this run only refreshes the DB.
      - name: Refresh Trivy DB
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          cache: "true"

  prune:
    name: Prune superseded caches
    # Only after both saves succeed, so the newest entry kept per family is the
    # one this run just refreshed.
    needs: [playwright, trivy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # GitHub evicts a cache only after 7 days unused (or past 10 GB), so each
      # superseded key lingered: on 2026-11-02, 12 of 17 caches (about 820 MB of
      # 1.34 GB) were older Trivy dates, lockfile hashes, apt images and uv
      # keys. Keep the newest per family; a PR on an older lockfile then misses
      # its node_modules cache and installs, which is slower but correct.
      - name: Delete all but the newest cache per family
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --ref refs/heads/main --limit 200 --json id,key,createdAt \
            | jq -r '
                def family: (.key | capture("^(?<f>cache-trivy-|[A-Za-z]+-node-modules-|[A-Za-z]+-playwright-apt-|[A-Za-z]+-playwright-[0-9]|setup-uv-|trivy-binary-)").f) // null;
                map(. + {family: family}) | map(select(.family != null))
                | group_by(.family)[] | sort_by(.createdAt) | reverse | .[1:][]
                | "\(.id) \(.key)"' \
            | while read -r id key; do
                echo "Deleting $key"
                gh cache delete "$id" --repo "$REPO"
              done
