name: Deploy Drift Check

# Why this exists: a push made with the automatic GITHUB_TOKEN does not trigger
# workflows ("if a workflow run pushes code using the repository's GITHUB_TOKEN,
# a new workflow will not run"), and the Auto-Merge Dependabot job in
# pr-checks.yml merges with exactly that token. So every dependabot PR it lands
# leaves main undeployed. Measured across 8 such commits — 99adf7cd, aa7cc935,
# c97e086d, b9772aa1, 0ecd2601, b2c93607, b8d90db1, d4fb70a6 — every one has
# zero Main CI/CD Pipeline runs. It went unnoticed because the next human push
# deploys whatever had piled up behind it, so the gap always closed late instead
# of never. The risk it leaves open is a CVE patch arriving as a semver-patch:
# auto-merged, and then sitting on main unshipped.
#
# The same hole swallows a deploy that failed for an unrelated reason. On
# 2026-08-17 the Frontend Tests job died downloading codecov-action (HTTP 429),
# which skipped deploy-mac-mini entirely and left main undeployed until the run
# was manually re-run.
#
# workflow_dispatch and repository_dispatch are the documented exceptions to the
# loop-prevention rule — they "always create workflow runs" — so re-arming the
# pipeline needs no PAT, just the plain GITHUB_TOKEN.
#
# Note: the Sync README Badges job pushes its `[skip ci]` commit to main, which
# by design never deploys. This check will therefore dispatch one deploy after
# such a commit, bringing the baked backend commit back in line with main. That
# is the intended trade: "production == main" becomes an invariant that is
# actually checked, at the cost of an occasional deploy for a README-only diff.
# `[skip ci]` does not suppress workflow_dispatch, so the dispatch still runs.

on:
  schedule:
    - cron: "30 19 * * *" # 04:30 KST daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare production against main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # required to workflow_dispatch the deploy pipeline
      checks: read # required to read the previous run's drift-target annotation
      issues: write # required to file/close the unreachable and not-landing issues

    steps:
      - name: Read the commit production is running
        id: live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # /api/health/ reports the commit baked into the running backend image
          # via the GIT_COMMIT build arg. auto-deploy.sh asserts it post-deploy,
          # so it is the same marker the deploy itself trusts.
          BODY=""
          for attempt in 1 2 3; do
            if BODY=$(curl -sf --max-time 20 https://emelmujiro.com/api/health/); then
              break
            fi
            echo "attempt $attempt: /api/health/ unreachable"
            BODY=""
            sleep 15
          done
          TITLE="Production unreachable: /api/health/ failed the drift check"
          if [ -z "$BODY" ]; then
            echo "::error::/api/health/ unreachable after 3 attempts — refusing to dispatch a deploy blind"
            # A red scheduled run notifies nobody (measured: the Mac mini sat
            # dead 2026-08-23 09:59 → 08-25 03:45 KST behind one silent red run,
            # because FileVault blocks the post-power-loss auto-restart at the
            # unlock screen). An issue does notify — file one, or bump the one
            # already open so repeat failures thread instead of piling up.
            EXISTING=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "Still unreachable after 3 attempts — $RUN_URL"
            else
              gh issue create --repo "$REPO" --title "$TITLE" --body "$(printf 'The daily deploy drift check could not reach https://emelmujiro.com/api/health/ after 3 attempts, so it refused to dispatch a deploy.\n\nLikely causes, most common first: Mac mini down at the FileVault unlock screen after a power loss (needs a physical unlock), Cloudflare tunnel down, or Docker Desktop not running.\n\nThis issue auto-closes when the next scheduled run reaches the endpoint.\n\nRun: %s' "$RUN_URL")"
            fi
            exit 1
          fi
          # Recovery path: the endpoint answered, so close any outage issue the
          # unreachable path filed on a previous night.
          OPEN=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$REPO" --comment "/api/health/ is reachable again — $RUN_URL"
          fi
          LIVE=$(printf '%s' "$BODY" | sed -n 's/.*"commit"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "Production reports commit: ${LIVE:-<absent>}"

      - name: Dispatch the deploy pipeline when production is behind main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE: ${{ steps.live.outputs.live }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A deploy that fails stays green (deploy-mac-mini is continue-on-error,
          # Gotcha #17), so a mismatch alone is not an alarm: main moves most
          # days, and two mismatches in a row can be two good deploys. The
          # alarm is narrower: each dispatch records its target as a
          # `drift-target` notice, and if production has not reached the
          # previous run's target by this run, that dispatched deploy never
          # landed. Intent: docs/intents/ci/deploy-not-landing-alarm.md
          TITLE="Deploy not landing: production missed the commit the drift check dispatched"
          close_alarm() {
            OPEN=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --repo "$REPO" --comment "$1 — $RUN_URL"
            fi
          }
          if [ "$LIVE" = "$HEAD_SHA" ]; then
            echo "✅ production is on $HEAD_SHA — nothing to deploy"
            close_alarm "Production is on main ($HEAD_SHA) again"
            exit 0
          fi
          ALARM=false
          if [ -z "$LIVE" ] || [ "$LIVE" = "unknown" ]; then
            echo "::warning::backend reports commit='$LIVE' — image built without GIT_COMMIT; redeploying to restore provenance"
          else
            echo "::warning::production is on $LIVE but main is $HEAD_SHA — dispatching deploy"
            PREV_TARGET=""
            # "<run id> <seconds since it finished>". A run that finished under
            # 2 h ago (a manual re-run) may still have its deploy in flight, so
            # it is not judged.
            PREV=$(gh run list --repo "$REPO" --workflow deploy-drift-check.yml --status completed --limit 1 --json databaseId,updatedAt --jq '.[0] // empty | "\(.databaseId) \(now - (.updatedAt | fromdateiso8601) | floor)"')
            PREV_RUN=${PREV%% *}
            PREV_AGE=${PREV#* }
            if [ -n "$PREV_RUN" ] && [ "$PREV_AGE" -lt 7200 ]; then
              echo "The previous drift check finished ${PREV_AGE}s ago; too recent to judge its dispatch"
            elif [ -n "$PREV_RUN" ]; then
              PREV_JOB=$(gh api "repos/$REPO/actions/runs/$PREV_RUN/jobs" --jq '.jobs[0].id // empty')
              if [ -n "$PREV_JOB" ]; then
                PREV_TARGET=$(gh api "repos/$REPO/check-runs/$PREV_JOB/annotations" --jq '[.[] | select(.title == "drift-target") | .message][0] // empty')
              fi
            fi
            if [ -n "$PREV_TARGET" ]; then
              if ! STATUS=$(gh api "repos/$REPO/compare/$PREV_TARGET...$LIVE" --jq .status); then
                STATUS=error
              fi
              case "$STATUS" in
                identical | ahead)
                  echo "Production reached the previous target $PREV_TARGET"
                  close_alarm "Production reached $PREV_TARGET, so deploys are landing again"
                  ;;
                behind | diverged)
                  ALARM=true
                  ;;
                *)
                  echo "::warning::could not compare the previous target $PREV_TARGET with $LIVE ($STATUS)"
                  ;;
              esac
            fi
          fi
          echo "::notice title=drift-target::$HEAD_SHA"
          gh workflow run "Main CI/CD Pipeline" --repo "$REPO" --ref main
          echo "Dispatched Main CI/CD Pipeline on main"
          if [ "$ALARM" = true ]; then
            echo "::error::production is still on $LIVE, behind $PREV_TARGET, which the previous drift check dispatched"
            EXISTING=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "Still not landing: production is on \`$LIVE\`, main is \`$HEAD_SHA\`, and the previous dispatch targeted \`$PREV_TARGET\`. Dispatched again — $RUN_URL"
            else
              # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
              gh issue create --repo "$REPO" --title "$TITLE" --body "$(printf 'The previous drift check dispatched a deploy of `%s`, but production still reports `%s`, which is behind it. Main is `%s`.\n\nA failed deploy stays green, because `deploy-mac-mini` is `continue-on-error` (CLAUDE.md Gotcha #17), so the run list will not show the failure. Read the `Deploy to Mac Mini` step of the latest Main CI/CD run, then `~/logs/deploy-webhook.log` on the deploy host.\n\nThis run dispatched another deploy. The issue auto-closes when a later drift check finds production on main, or on the commit it dispatched.\n\nRun: %s' "$PREV_TARGET" "$LIVE" "$HEAD_SHA" "$RUN_URL")"
            fi
            exit 1
          fi
