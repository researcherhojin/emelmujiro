packages:
  - "**"
  - "!dist"
  - "!**/dist/**"
allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@swc/core": false
  esbuild: false
  msw: false
  prisma: true
  sharp: false
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
minimumReleaseAgeExclude:
  - "@umami/react-zen"
  - cn@0.2.6
  - "@umami/api-client@0.81.0"

# Security floors for transitive dependencies whose parents still allow affected versions.
overrides:
  "@babel/core@<7.29.6": 7.29.6
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
